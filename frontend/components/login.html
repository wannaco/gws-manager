<div id="page-login" class="min-h-screen flex items-center justify-center p-4">
  <div class="card bg-base-100 shadow-xl w-full max-w-sm fade-in">
    <div class="card-body">
      <h1 class="card-title text-2xl justify-center mb-2">GWS Admin</h1>

      <!-- Tab switcher -->
      <div class="tabs tabs-boxed justify-center mb-4">
        <a id="tab-signin" class="tab tab-active" onclick="switchAuthTab('signin')">Sign In</a>
        <a id="tab-register" class="tab" onclick="switchAuthTab('register')">Create Account</a>
      </div>

      <div id="login-error" class="alert alert-error text-sm hidden"></div>

      <!-- Sign In fields -->
      <div id="auth-signin-fields">
        <div class="form-control">
          <label class="label"><span class="label-text">Email</span></label>
          <input id="login-email" type="email" class="input input-bordered" placeholder="you@domain.com" autocomplete="email">
        </div>
        <div class="form-control mt-2">
          <label class="label"><span class="label-text">Password</span></label>
          <input id="login-password" type="password" class="input input-bordered" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <div class="card-actions mt-4">
          <button id="btn-login" class="btn btn-primary w-full" onclick="doLogin()">Sign In</button>
        </div>
      </div>

      <!-- Register fields (hidden by default) -->
      <div id="auth-register-fields" class="hidden">
        <div class="form-control">
          <label class="label"><span class="label-text">Email</span></label>
          <input id="reg-email" type="email" class="input input-bordered" placeholder="you@domain.com" autocomplete="email">
        </div>
        <div class="form-control mt-2">
          <label class="label"><span class="label-text">Password</span></label>
          <input id="reg-password" type="password" class="input input-bordered" placeholder="8+ characters" autocomplete="new-password">
        </div>
        <div class="form-control mt-2">
          <label class="label"><span class="label-text">Confirm Password</span></label>
          <input id="reg-password-confirm" type="password" class="input input-bordered" placeholder="Re-enter password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()">
        </div>
        <div class="card-actions mt-4">
          <button id="btn-register" class="btn btn-primary w-full" onclick="doRegister()">Create Account</button>
        </div>
      </div>
    </div>
  </div>
</div>
