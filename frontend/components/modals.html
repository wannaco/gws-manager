<!-- ===== MODALS ===== -->
<!-- Generic modal container -->
<div id="modal-overlay" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
  <div id="modal-box" class="bg-base-100 rounded-box shadow-2xl w-full max-w-md p-6 fade-in max-h-[90vh] overflow-y-auto"></div>
</div>

<!-- Template Gallery & Saved Templates modal -->
<div id="template-gallery-overlay" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4" onclick="if(event.target===this)closeTemplateGallery()">
  <div id="template-gallery-box" class="bg-base-100 border border-base-300 rounded-2xl shadow-2xl w-full max-w-5xl p-6 fade-in max-h-[90vh] overflow-y-auto"></div>
</div>
