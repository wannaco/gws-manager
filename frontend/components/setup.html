<div id="page-setup" class="hidden min-h-screen flex items-center justify-center p-4 bg-base-200/60">
  <div class="card bg-base-100 border border-base-300 shadow-lg w-full max-w-lg fade-in">
    <div class="card-body">
      <div class="flex items-center justify-between">
        <h2 class="card-title text-xl font-bold">Setup Your Domain</h2>
        <button class="btn btn-ghost btn-sm" onclick="doLogout()">← Logout</button>
      </div>
      <p class="text-sm text-base-content/60 mb-2">Connect your Google Workspace domain.</p>
      <div class="gws-callout mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span>Don't have a GCP project yet? <a href="https://shell.cloud.google.com/cloudshell/editor?cloudshell_git_repo=https://github.com/wannaco/gws-manager.git&cloudshell_tutorial=tutorial.md&cloudshell_workspace=." target="_blank" rel="noopener" class="link link-primary font-semibold">Open setup tutorial in Cloud Shell ↗</a></span>
      </div>
      <div id="setup-error" class="alert alert-error text-sm hidden"></div>
      <div id="setup-step-1">
        <div class="form-control">
          <label class="label"><span class="label-text">Domain</span></label>
          <input id="setup-domain" type="text" class="input input-bordered" placeholder="example.com">
        </div>
        <div class="form-control mt-3">
          <label class="label"><span class="label-text">Admin Email</span></label>
          <input id="setup-admin-email" type="email" class="input input-bordered" placeholder="admin@example.com">
        </div>
        <button class="btn btn-primary w-full mt-6" onclick="setupNext()">Next</button>
      </div>
      <div id="setup-step-2" class="hidden">
        <div class="form-control">
          <label class="label"><span class="label-text">Service Account JSON Key</span></label>
          <div id="setup-sa-dropzone"
               class="border-2 border-dashed border-base-300 hover:border-primary rounded-lg p-4 text-center cursor-pointer transition-colors mb-2 bg-base-200/40"
               onclick="document.getElementById('setup-sa-file').click()"
               ondragover="event.preventDefault(); this.classList.add('border-primary','bg-primary/5')"
               ondragleave="this.classList.remove('border-primary','bg-primary/5')"
               ondrop="handleSaKeyDrop(event)">
            <input id="setup-sa-file" type="file" accept=".json,application/json" class="hidden" onchange="handleSaKeyFile(this.files[0])">
            <div class="text-sm font-medium text-base-content/80">Drop your <span class="mono">.json</span> key file here, or <span class="link link-primary">browse</span></div>
            <div id="setup-sa-file-status" class="text-xs text-base-content/50 mt-1">Downloaded from Google Cloud Console or <span class="mono">setup.sh</span></div>
          </div>
          <textarea id="setup-sa-key" class="textarea textarea-bordered h-36 font-mono text-xs" placeholder="...or paste your GCP service account JSON key here"></textarea>
        </div>
        <div class="flex gap-2 mt-6">
          <button class="btn btn-outline flex-1" onclick="setupBack()">Back</button>
          <button id="btn-setup-finish" class="btn btn-primary flex-1" onclick="doSetup()">Connect Domain</button>
        </div>
      </div>
    </div>
  </div>
</div>
