<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>GWS Admin</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2.0.2"></script>
<link href="https://cdn.jsdelivr.net/npm/suneditor@2.47.6/dist/css/suneditor.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/suneditor@2.47.6/dist/suneditor.min.js"></script>
<link rel="stylesheet" href="/styles/index.css?v=39">
</head>
<body>

<!-- Components -->
<div hx-get="/components/login.html?v=39" hx-trigger="load once" hx-swap="outerHTML"></div>
<div hx-get="/components/setup.html?v=39" hx-trigger="load once" hx-swap="outerHTML"></div>

<!-- ===== DASHBOARD ===== -->
<div id="page-dashboard" class="hidden min-h-screen flex flex-col">
  <!-- Mobile drawer overlay (hidden on desktop) -->
  <input id="dashboard-drawer" type="checkbox" class="hidden">
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-40 hidden" onclick="closeSidebar()"></div>

  <div class="flex flex-1">
    <!-- Sidebar -->
    <aside id="app-sidebar" class="w-64 bg-base-100 border-r border-base-300 min-h-screen flex flex-col shrink-0">
      <div class="px-5 pt-5 pb-4 border-b border-base-300/70">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-primary flex items-center justify-center text-primary-content font-bold text-base shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </div>
          <div class="min-w-0">
            <h2 class="font-bold text-base leading-tight">GWS Admin</h2>
            <p class="text-xs text-base-content/50 truncate" id="sidebar-domain"></p>
          </div>
        </div>
      </div>
      <nav class="px-3 py-3 flex-1">
        <ul class="flex flex-col gap-0.5 w-full">
          <li class="gws-nav-head">Directory</li>
          <li>
            <a id="sidebar-gws-users" class="sidebar-item" onclick="navTo('gws-users')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>GWS Users</span>
            </a>
          </li>
          <li class="gws-nav-head">Signatures</li>
          <li>
            <a id="sidebar-sig-bulk" class="sidebar-item" onclick="navTo('sig-bulk')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              <span>Bulk Signatures</span>
            </a>
          </li>
          <li>
            <a id="sidebar-schedules" class="sidebar-item" onclick="navTo('schedules')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
              <span>Schedules</span>
            </a>
          </li>
          <li>
            <a id="sidebar-bulk-jobs" class="sidebar-item" onclick="navTo('bulk-jobs')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/></svg>
              <span>Bulk Jobs</span>
            </a>
          </li>
          <li class="gws-nav-head" id="nav-head-settings">Workspace</li>
          <li>
            <a id="sidebar-settings" class="sidebar-item" onclick="navTo('settings')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
              <span>Settings</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Main content -->
    <div class="flex flex-col flex-1 min-w-0">
      <!-- Top bar -->
      <header class="navbar bg-base-100 border-b border-base-300 min-h-14 px-6 gap-4">
        <button id="mobile-menu-btn" class="btn btn-square btn-ghost btn-sm" onclick="openSidebar()" aria-label="Open menu">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
        <div class="flex-1"><span id="nav-domain" class="font-semibold text-sm text-base-content/80"></span></div>
        <div class="flex items-center gap-2.5">
          <button class="btn btn-ghost btn-sm btn-square" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
            <span id="theme-icon" class="inline-flex items-center justify-center"></span>
          </button>
          <span id="nav-user" class="text-sm hidden sm:inline text-base-content/70"></span>
          <span id="nav-role" class="badge badge-ghost badge-sm hidden sm:inline"></span>
          <button class="btn btn-ghost btn-sm text-error hover:bg-error/10" onclick="doLogout()">Logout</button>
        </div>
      </header>
      <div hx-get="/components/dashboard-sections.html?v=39" hx-trigger="load once" hx-swap="outerHTML"></div>
    </div>
  </div>
</div>

<!-- Load modals as component -->
<div hx-get="/components/modals.html?v=39" hx-trigger="load once" hx-swap="outerHTML"></div>

<!-- JavaScript Modules -->
<script src="/js/api.js?v=39"></script>
<script src="/js/auth.js?v=39"></script>
<script src="/js/dashboard.js?v=39"></script>
<script src="/js/users.js?v=39"></script>
<script src="/js/user-tabs.js?v=39"></script>
<script src="/js/signature.js?v=39"></script>
<script src="/js/templates-gallery.js?v=39"></script>
<script src="/js/sendas-audit.js?v=39"></script>
<script src="/js/bulk.js?v=39"></script>
<script src="/js/audience.js?v=39"></script>
<script src="/js/bulkjobs.js?v=39"></script>
<script src="/js/schedules.js?v=39"></script>
<script src="/js/settings.js?v=39"></script>
<script src="/js/modals.js?v=39"></script>
<script src="/js/main.js?v=39"></script>
<script>
  // Force manual initialization if HTMX missed the trigger
  document.addEventListener('DOMContentLoaded', () => {
    console.log('DOM ready, checking for HTMX...');
    if (typeof htmx !== 'undefined') {
      htmx.process(document.body);
    } else {
      console.error('HTMX is NOT loaded!');
    }
  });
</script>
</body>
</html>
